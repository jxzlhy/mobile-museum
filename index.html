<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <title>手机历史博物馆 — MOBILE MUSEUM</title>
    <meta
      name="description"
      content="一座手机主题的数字博物馆。从 1973 年第一通手持电话，到 AI 时代——探索移动电话五十余年的演进。一部手机，不只是一台手机。"
    />
    <meta property="og:title" content="手机历史博物馆 — MOBILE MUSEUM" />
    <meta property="og:description" content="一座手机主题的数字博物馆。一部手机，不只是一台手机。" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <!-- 启动阶段错误捕获：main.ts 的错误监听注册之前发生的崩溃
         会留下空 #app——在这里记录，供 QA/ErrorBoundary 诊断（§71） -->
    <script>
      window.__bootErrors = [];
      window.addEventListener('error', function (e) {
        window.__bootErrors.push(
          (e.message || 'script load failed') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErrors.push('rejection: ' + String(e.reason).slice(0, 200));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
